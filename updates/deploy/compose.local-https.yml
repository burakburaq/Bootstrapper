services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The official Caddy binary carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m"]
    ports:
      - "127.0.0.1:8443:8443"
      - "${UPDATE_HYPERV_HOST_IP:?Set UPDATE_HYPERV_HOST_IP in local/https.env}:8443:8443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - local-caddy-data:/data
      - local-caddy-config:/config
    depends_on:
      update-server:
        condition: service_healthy

volumes:
  local-caddy-data:
  local-caddy-config:
