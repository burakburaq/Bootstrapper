global
    log stdout format raw local0
    stats socket ipv4@127.0.0.1:9999 level admin
defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
frontend updates
    bind :8080
    use_backend %[str(active),map_str(/etc/haproxy/maps/active.map,blue)]
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
backend blue
    server slot update-server-blue:8080 resolvers docker init-addr libc,none
backend green
    server slot update-server-green:8080 resolvers docker init-addr libc,none
