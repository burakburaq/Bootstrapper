<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 256 256"
>
  <filter
    id="glass"
    x="0"
    y="0"
    width="100%"
    height="100%"
    color-interpolation-filters="sRGB"
  >
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.28"
      numOctaves="3"
      seed="9"
      stitchTiles="stitch"
      result="surface"
    />
    <feDiffuseLighting
      in="surface"
      surfaceScale="2.8"
      diffuseConstant="1.1"
      lighting-color="#fff"
    >
      <feDistantLight azimuth="225" elevation="50" />
    </feDiffuseLighting>
  </filter>
  <rect width="256" height="256" fill="#fff" filter="url(#glass)" />
</svg>
